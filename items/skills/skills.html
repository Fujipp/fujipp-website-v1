<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circular Progress Bar</title>
    <link rel="stylesheet" href="skills.html" />
  </head>
  <body>
    <div class="container">
      <h3>Skills</h3>
      <div class="box">
        <p style="font-size: 25px; font-weight: bold">HTML</p>
        <div class="progress_bar_box">
          <div class="progress_bar">
            <span class="line"></span>
          </div>
          <p class="increasing_percentage">0%</p>
          <div class="total_percentage">60%</div>
        </div>
      </div>
      <div class="box">
        <p style="font-size: 25px; font-weight: bold">CSS</p>
        <div class="progress_bar_box">
          <div class="progress_bar">
            <span class="line"></span>
          </div>
          <p class="increasing_percentage">0%</p>
          <div class="total_percentage">40%</div>
        </div>
      </div>

      <div class="box">
        <p style="font-size: 25px; font-weight: bold">JAVASCRIPT</p>
        <div class="progress_bar_box">
          <div class="progress_bar">
            <span class="line"></span>
          </div>
          <p class="increasing_percentage">0%</p>
          <div class="total_percentage">15%</div>
        </div>
      </div>

      <div class="box">
        <p style="font-size: 25px; font-weight: bold">JAVA</p>
        <div class="progress_bar_box">
          <div class="progress_bar">
            <span class="line"></span>
          </div>
          <p class="increasing_percentage">0%</p>
          <div class="total_percentage">10%</div>
        </div>
      </div>
    </div>
  </body>
  <script src="skiils.js"></script>
</html>
